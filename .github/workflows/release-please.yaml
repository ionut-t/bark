name: Release Please

on:
  push:
    branches:
      - main

# Each job asks for what it needs; the build jobs, which run the most
# code, can only read the repository.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      build_date: ${{ steps.date.outputs.build_date }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go
          package-name: bark
          version-file: internal/version/version.go

      # Read once so every binary carries the same date, even when the
      # builds straddle midnight UTC.
      - name: Build date
        id: date
        if: ${{ steps.release.outputs.release_created }}
        run: echo "build_date=$(date -u +%d/%m/%Y)" >> "$GITHUB_OUTPUT"

  # One runner per target: a build compiles the whole module, including
  # gotreesitter's grammars, and already keeps the runner's cores busy, so
  # building the targets one after another on one runner took ~10 minutes
  # and running them side by side there was slower still.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64, bin: bark-darwin-arm64 }
          - { goos: darwin, goarch: amd64, bin: bark-darwin-amd64 }
          - { goos: linux, goarch: amd64, bin: bark-linux-amd64 }
          - { goos: linux, goarch: arm64, bin: bark-linux-arm64 }
          - { goos: windows, goarch: amd64, bin: bark-windows-amd64.exe }
          - { goos: windows, goarch: arm64, bin: bark-windows-arm64.exe }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.bin }}
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          BUILD_DATE: ${{ needs.release-please.outputs.build_date }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BIN: ${{ matrix.bin }}
          # Without cgo the binaries are static and don't depend on the
          # runner's libc.
          CGO_ENABLED: "0"
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-X 'github.com/ionut-t/bark/v2/internal/version.version=$VERSION' -X 'github.com/ionut-t/bark/v2/internal/version.commit=$COMMIT' -X 'github.com/ionut-t/bark/v2/internal/version.date=$BUILD_DATE'"
          # -trimpath keeps the build machine's paths out of the binary.
          go build -trimpath -ldflags="$LDFLAGS" -o "dist/$BIN"

      - name: Upload ${{ matrix.bin }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bin }}
          path: dist/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance for the release binaries (see "Attest build
      # provenance"); the bark actions verify it before running a binary.
      id-token: write
      attestations: write
    steps:
      # For pushing the major version tag.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bark-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          # Artifacts don't keep file modes.
          chmod +x dist/*
          if [ "$(ls dist | wc -l)" -ne 6 ]; then
            echo "::error::expected 6 binaries in dist, got: $(ls dist)"
            exit 1
          fi
          cd dist
          sha256sum * > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/bark-*"

      - name: Upload Release Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$VERSION" dist/*

      - name: Move the major version tag
        # Workflows that use ionut-t/bark/.github/actions/...@v2 get each
        # release once it's built; an exact tag (@v2.35.0) stays put.
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          MAJOR="${VERSION%%.*}"
          git tag -f "$MAJOR" "$SHA"
          git push -f origin "refs/tags/$MAJOR"

      - name: Update Release with Installation Instructions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.release-please.outputs.tag_name }}

          # Get the existing release body (changelog generated by Release Please)
          EXISTING_BODY=$(gh release view $VERSION --json body -q .body)

          # Create installation instructions
          cat << 'EOF' > instructions.md

          ---

          ## Installation

          ### macOS (Apple Silicon)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/$VERSION/bark-darwin-arm64 -o bark && chmod +x bark
          ```

          ### macOS (Intel)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/$VERSION/bark-darwin-amd64 -o bark && chmod +x bark
          ```

          ### Linux (64-bit)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/$VERSION/bark-linux-amd64 -o bark && chmod +x bark
          ```

          ### Linux (ARM64)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/$VERSION/bark-linux-arm64 -o bark && chmod +x bark
          ```

          ### For macOS and Linux
          After downloading, move the binary to your PATH:
          ```bash
          sudo mv bark /usr/local/bin/
          # or
          mkdir -p ~/bin && mv bark ~/bin/ && echo 'export PATH="$HOME/bin:$PATH"' >> ~/.zshrc
          source ~/.zshrc
          ```

          ### Windows
          Download `bark-windows-amd64.exe` (or `bark-windows-arm64.exe` on ARM) from the assets below and add it to your PATH.

          ### Verify Installation
          ```bash
          bark --version
          ```

          ---

          **Verify your download:** `checksums.txt` in the assets below has each binary's SHA-256. To check that a binary was built by this repository's release workflow:
          ```bash
          gh attestation verify bark-linux-amd64 --repo ${{ github.repository }}
          ```
          EOF

          # Replace $VERSION placeholder in the instructions
          sed -i "s/\$VERSION/$VERSION/g" instructions.md

          # Combine existing body with instructions
          echo "$EXISTING_BODY" > combined.md
          cat instructions.md >> combined.md

          # Update the release with combined content
          gh release edit $VERSION --notes-file combined.md
