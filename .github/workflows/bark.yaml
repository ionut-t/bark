name: Bark

# Reviews run when a PR is opened (except from chore/, docs/ and build/
# branches) and when the "bark: review" label is added
# (the review job removes it again). With inline comments, "bark: review"
# reviews only the commits since Bark's last review; "bark: full review"
# reviews the whole PR. "bark: describe" regenerates the PR description.
# With the BARK_APPROVE variable set to "true" (and BARK_INLINE_COMMENTS),
# a review with nothing blocking approves the PR (BARK_APPROVE_BELOW sets the
# severity that blocks it, medium by default); the repository must allow
# GitHub Actions to approve pull requests (Settings → Actions → General).
# With inline comments, Bark resolves its own threads that its check finds
# fixed, and replies on each with the reason; resolving needs the review
# job's contents: write.
# Pushes to an open PR don't trigger anything.
on:
  pull_request:
    types: [opened, labeled]

jobs:
  pr-description:
    name: Generate PR Description
    runs-on: ubuntu-latest
    if: "github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'bark: describe')"
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build bark
        run: go build -o /tmp/bark .

      - name: Generate PR description
        env:
          BARK_API_KEY: ${{ secrets.BARK_API_KEY }}
          BARK_PROVIDER: ${{ vars.BARK_PROVIDER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BARK_MODEL: ${{ vars.BARK_DESCRIPTION_MODEL || vars.BARK_MODEL }}
          BARK_MAX_DIFF_TOKENS: ${{ vars.BARK_MAX_DIFF_TOKENS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PROVIDER=$(echo "$BARK_PROVIDER" | tr '[:upper:]' '[:lower:]')
          case "$PROVIDER" in
            "gemini") export GEMINI_API_KEY="$BARK_API_KEY" ;;
            "openai") export OPENAI_API_KEY="$BARK_API_KEY" ;;
            "anthropic") export ANTHROPIC_API_KEY="$BARK_API_KEY" ;;
            "vertexai"|"ollama")
              echo "Error: provider '$PROVIDER' needs more than an API key (Vertex AI: service-account credentials; Ollama: a reachable server) and is not supported in this workflow. Use gemini, openai or anthropic." >&2
              exit 1 ;;
            *) echo "Error: unknown provider '$PROVIDER'. Use gemini, openai or anthropic." >&2; exit 1 ;;
          esac

          ARGS=(pr --pr "$PR_NUMBER" --provider "$PROVIDER")
          [ -n "$BARK_MODEL" ] && ARGS+=(--model "$BARK_MODEL")
          [ -n "$BARK_MAX_DIFF_TOKENS" ] && ARGS+=(--max-diff-tokens "$BARK_MAX_DIFF_TOKENS")
          /tmp/bark "${ARGS[@]}" > /tmp/bark-pr.txt

          if [ ! -s /tmp/bark-pr.txt ]; then
            echo "PR description output is empty. See Bark's output above." >&2
            exit 1
          fi

      - name: Update PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          jq -n --arg body "$(cat /tmp/bark-pr.txt)" '{"body": $body}' | \
            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" -X PATCH --input -

  review:
    name: AI Code Review
    needs: pr-description
    # always() lets the job run when pr-description is skipped (a "bark: review" label).
    # PRs from chore/, docs/ and build/ branches aren't reviewed on open; the label still works.
    if: >-
      always() && (
        (github.event.action == 'opened' && needs.pr-description.result == 'success'
          && !startsWith(github.head_ref, 'chore/')
          && !startsWith(github.head_ref, 'docs/')
          && !startsWith(github.head_ref, 'build/'))
        || (github.event.action == 'labeled'
          && (github.event.label.name == 'bark: review' || github.event.label.name == 'bark: full review'))
      )
    runs-on: ubuntu-latest
    permissions:
      # GitHub refuses resolveReviewThread to a token with only
      # pull-requests: write, so resolving fixed threads needs this.
      # Pull requests from forks get a read-only token whatever it says.
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The whole history: a review of only the changes since the last
          # one diffs the commits locally.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build bark
        run: go build -o /tmp/bark .

      - name: Run bark review
        env:
          BARK_API_KEY: ${{ secrets.BARK_API_KEY }}
          BARK_PROVIDER: ${{ vars.BARK_PROVIDER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BARK_MODEL: ${{ vars.BARK_MODEL }}
          BARK_REVIEWER: ${{ vars.BARK_REVIEWER }}
          BARK_MAX_DIFF_TOKENS: ${{ vars.BARK_MAX_DIFF_TOKENS }}
          BARK_WITH_CONTEXT: ${{ vars.BARK_WITH_CONTEXT }}
          BARK_INLINE_COMMENTS: ${{ vars.BARK_INLINE_COMMENTS }}
          BARK_APPROVE: ${{ vars.BARK_APPROVE }}
          BARK_APPROVE_BELOW: ${{ vars.BARK_APPROVE_BELOW }}
          WITH_DESCRIPTION: ${{ needs.pr-description.result == 'success' }}
          FULL_REVIEW: "${{ github.event.label.name == 'bark: full review' }}"
        run: |
          PROVIDER=$(echo "$BARK_PROVIDER" | tr '[:upper:]' '[:lower:]')
          case "$PROVIDER" in
            "gemini") export GEMINI_API_KEY="$BARK_API_KEY" ;;
            "openai") export OPENAI_API_KEY="$BARK_API_KEY" ;;
            "anthropic") export ANTHROPIC_API_KEY="$BARK_API_KEY" ;;
            "vertexai"|"ollama")
              echo "Error: provider '$PROVIDER' needs more than an API key (Vertex AI: service-account credentials; Ollama: a reachable server) and is not supported in this workflow. Use gemini, openai or anthropic." >&2
              exit 1 ;;
            *) echo "Error: unknown provider '$PROVIDER'. Use gemini, openai or anthropic." >&2; exit 1 ;;
          esac

          ARGS=(review --pr "${{ github.event.pull_request.number }}" --provider "$PROVIDER")
          [ -n "$BARK_REVIEWER" ] && ARGS+=(--as "$BARK_REVIEWER")
          [ -n "$BARK_MODEL" ] && ARGS+=(--model "$BARK_MODEL")
          [ -n "$BARK_MAX_DIFF_TOKENS" ] && ARGS+=(--max-diff-tokens "$BARK_MAX_DIFF_TOKENS")
          [ "$BARK_WITH_CONTEXT" = "true" ] && ARGS+=(--with-context)
          [ "$WITH_DESCRIPTION" = "true" ] && ARGS+=(--with-description)
          # Posts a review with inline comments itself; the next step is skipped.
          [ "$BARK_INLINE_COMMENTS" = "true" ] && ARGS+=(--comment)
          [ "$FULL_REVIEW" = "true" ] && ARGS+=(--full)
          # Approving needs the review posted with inline comments. A branch
          # from before --approve existed builds a Bark without it.
          if [ "$BARK_APPROVE" = "true" ] && [ "$BARK_INLINE_COMMENTS" = "true" ]; then
            if /tmp/bark review --help | grep -q -- '--approve'; then
              ARGS+=(--approve)
              [ -n "$BARK_APPROVE_BELOW" ] && ARGS+=(--approve-below "$BARK_APPROVE_BELOW")
            else
              echo "::warning::BARK_APPROVE is set, but this branch's Bark has no --approve; posting the review without approving."
            fi
          elif [ "$BARK_APPROVE" = "true" ]; then
            echo "::warning::BARK_APPROVE needs BARK_INLINE_COMMENTS=true; posting the review without approving."
          fi
          /tmp/bark "${ARGS[@]}" > /tmp/bark-review.txt

      - name: Post or update PR comment
        if: vars.BARK_INLINE_COMMENTS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s /tmp/bark-review.txt ]; then
            echo "Review output is empty. See the 'Run bark review' step log." >&2
            exit 1
          fi

          MARKER="<!-- bark-review -->"
          BODY=$(printf '%s\n## Bark AI Code Review\n\n%s' "$MARKER" "$(cat /tmp/bark-review.txt)")

          # --paginate: without it gh returns only the first 30 comments, and on a
          # busy PR the earlier review is missed and a duplicate posted. The first
          # ID is taken in bash: | head -1 can kill gh with SIGPIPE under pipefail.
          COMMENT_IDS=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("<!-- bark-review -->")) | .id')
          COMMENT_ID=${COMMENT_IDS%%$'\n'*}

          if [ -n "$COMMENT_ID" ]; then
            jq -n --arg body "$BODY" '{"body": $body}' | \
              gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -X PATCH --input -
          else
            jq -n --arg body "$BODY" '{"body": $body}' | \
              gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -X POST --input -
          fi

      - name: Add reviewer label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BARK_REVIEWER: ${{ vars.BARK_REVIEWER }}
        run: |
          REVIEWER="${BARK_REVIEWER:-bark}"
          LABEL="Reviewed by ${REVIEWER^}"
          gh label create "$LABEL" --repo "${{ github.repository }}" --color "0075ca" --force 2>/dev/null || true
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-label "$LABEL"

      - name: Remove review label
        # Runs even if the review failed, so adding the label again retries.
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ github.event.label.name }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label "$LABEL" || true
