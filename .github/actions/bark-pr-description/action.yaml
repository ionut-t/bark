name: Bark PR Description
description: Generate a pull request description using bark AI and update the PR body

inputs:
  bark-version:
    description: Bark release to install. Defaults to the latest release.
    required: false
    default: "latest"
  provider:
    description: "LLM provider to use: gemini or openai."
    required: true
  api-key:
    description: API key for the configured provider.
    required: true
  model:
    description: LLM model to use (e.g. gemini-2.5-pro, gpt-5.4-mini).
    required: true
  instructions:
    description: |
      Custom instructions for generating the PR description. Accepts a path to a
      .md file (e.g. .bark/pr.md) or raw text. Omit to use
      the default PR instructions.
    required: false
    default: ""
  max-diff-lines:
    description: Maximum number of diff lines to include in the prompt (0 disables the limit).
    required: false
    default: ""
  github-token:
    description: GitHub token for updating the PR body
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install bark
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BARK_VERSION: ${{ inputs.bark-version }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   ASSET=bark-linux-amd64;       BIN=bark ;;
          Linux-ARM64) ASSET=bark-linux-arm64;       BIN=bark ;;
          macOS-X64)   ASSET=bark-darwin-amd64;      BIN=bark ;;
          macOS-ARM64) ASSET=bark-darwin-arm64;      BIN=bark ;;
          Windows-X64) ASSET=bark-windows-amd64.exe; BIN=bark.exe ;;
          *) echo "Error: unsupported runner $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac

        DEST="$RUNNER_TEMP/bark-bin"
        mkdir -p "$DEST"

        ARGS=(--repo ionut-t/bark --pattern "$ASSET" --pattern checksums.txt --dir "$DEST")
        if [ "$BARK_VERSION" != "latest" ]; then
          ARGS=("$BARK_VERSION" "${ARGS[@]}")
        fi
        gh release download "${ARGS[@]}"

        cd "$DEST"
        if command -v sha256sum >/dev/null; then
          awk -v f="$ASSET" '$2 == f' checksums.txt | sha256sum -c -
        else
          awk -v f="$ASSET" '$2 == f' checksums.txt | shasum -a 256 -c -
        fi

        mv "$ASSET" "$BIN"
        chmod +x "$BIN"
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Generate PR description
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PROVIDER=$(echo "${{ inputs.provider }}" | tr '[:upper:]' '[:lower:]')
        case "$PROVIDER" in
          "gemini")
            export GEMINI_API_KEY="${{ inputs.api-key }}"
            ;;
          "openai")
            export OPENAI_API_KEY="${{ inputs.api-key }}"
            ;;
          *)
            echo "Error: Unknown provider $PROVIDER"
            exit 1
            ;;
        esac

        ARGS=(pr --pr "${{ github.event.pull_request.number }}" --provider "$PROVIDER" --model "${{ inputs.model }}")
        [ -n "${{ inputs.instructions }}" ] && ARGS+=(--instructions "${{ inputs.instructions }}")
        [ -n "${{ inputs.max-diff-lines }}" ] && ARGS+=(--max-diff-lines "${{ inputs.max-diff-lines }}")

        bark "${ARGS[@]}" \
          > /tmp/bark-pr.txt 2>/tmp/bark-pr-error.txt

        if [ ! -s /tmp/bark-pr.txt ]; then
          echo "PR description output is empty. Bark stderr:" >&2
          cat /tmp/bark-pr-error.txt >&2
          exit 1
        fi

    - name: Update PR body
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        jq -n --arg body "$(cat /tmp/bark-pr.txt)" '{"body": $body}' | \
          gh api "repos/$REPO/pulls/$PR_NUMBER" -X PATCH --input -
