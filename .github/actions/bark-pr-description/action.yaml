name: Bark PR Description
description: Generate a pull request description using bark AI and update the PR body

inputs:
  bark-version:
    description: |
      Bark release to install: a tag such as v2.35.0, or "latest". Defaults
      to the release this action comes from, so the action and the binary
      always match: ionut-t/bark/.github/actions/...@v2.35.0 installs
      v2.35.0. The binary is checked against the release's checksums and,
      for releases that have it, its signed build provenance.
    required: false
    default: ""
  provider:
    description: "LLM provider to use: gemini, openai or anthropic."
    required: true
  api-key:
    description: API key for the configured provider.
    required: true
  model:
    description: LLM model to use (e.g. gemini-2.5-pro, gpt-5.4-mini).
    required: true
  instructions:
    description: |
      Custom instructions for generating the PR description. Accepts a path to a
      .md file (e.g. .bark/pr.md) or raw text. Omit to use
      the default PR instructions.
    required: false
    default: ""
  max-diff-tokens:
    description: Maximum number of diff tokens to include in the prompt, estimated at 2.5 characters a token (0 disables the limit).
    required: false
    default: ""
  max-diff-lines:
    description: Maximum number of diff lines to include in the prompt (0 disables the limit).
    deprecationMessage: max-diff-lines is deprecated; use max-diff-tokens.
    required: false
    default: ""
  timeout:
    description: |
      How long one model call may take before Bark gives up, as a duration
      such as 10m or 90s. Raise it for slow models or large pull requests
      (default: 3m).
    required: false
    default: ""
  github-token:
    description: GitHub token for updating the PR body
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install bark
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BARK_VERSION: ${{ inputs.bark-version }}
      run: bash "$GITHUB_ACTION_PATH/../install-bark.sh"

    - name: Generate PR description
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # Values reach the script through env: an expression in the script
        # would be pasted in before bash parses it.
        BARK_PROVIDER: ${{ inputs.provider }}
        BARK_API_KEY: ${{ inputs.api-key }}
        BARK_MODEL: ${{ inputs.model }}
        BARK_INSTRUCTIONS: ${{ inputs.instructions }}
        BARK_MAX_DIFF_TOKENS: ${{ inputs.max-diff-tokens }}
        BARK_MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
        BARK_TIMEOUT: ${{ inputs.timeout }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        PROVIDER=$(echo "$BARK_PROVIDER" | tr '[:upper:]' '[:lower:]')
        case "$PROVIDER" in
          "gemini")
            export GEMINI_API_KEY="$BARK_API_KEY"
            ;;
          "openai")
            export OPENAI_API_KEY="$BARK_API_KEY"
            ;;
          "anthropic")
            export ANTHROPIC_API_KEY="$BARK_API_KEY"
            ;;
          "vertexai"|"ollama")
            echo "Error: provider '$PROVIDER' needs more than an API key (Vertex AI: service-account credentials; Ollama: a reachable server) and is not supported by this action. Use gemini, openai or anthropic." >&2
            exit 1
            ;;
          *)
            echo "Error: unknown provider '$PROVIDER'. Use gemini, openai or anthropic." >&2
            exit 1
            ;;
        esac
        unset BARK_API_KEY

        ARGS=(pr --pr "$PR_NUMBER" --provider "$PROVIDER" --model "$BARK_MODEL")
        [ -n "$BARK_INSTRUCTIONS" ] && ARGS+=(--instructions "$BARK_INSTRUCTIONS")
        [ -n "$BARK_MAX_DIFF_TOKENS" ] && ARGS+=(--max-diff-tokens "$BARK_MAX_DIFF_TOKENS")
        [ -n "$BARK_MAX_DIFF_LINES" ] && ARGS+=(--max-diff-lines "$BARK_MAX_DIFF_LINES")
        # Only when set, so a pinned older Bark doesn't get a flag it lacks.
        [ -n "$BARK_TIMEOUT" ] && ARGS+=(--timeout "$BARK_TIMEOUT")

        bark "${ARGS[@]}" > /tmp/bark-pr.txt

        if [ ! -s /tmp/bark-pr.txt ]; then
          echo "PR description output is empty. See Bark's output above." >&2
          exit 1
        fi

    - name: Update PR body
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        jq -n --arg body "$(cat /tmp/bark-pr.txt)" '{"body": $body}' | \
          gh api "repos/$REPO/pulls/$PR_NUMBER" -X PATCH --input -
