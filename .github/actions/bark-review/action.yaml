name: Bark AI Code Review
description: Run bark AI code review on a pull request and post results as a comment

inputs:
  bark-version:
    description: |
      Bark release to install: a tag such as v2.35.0, or "latest". Defaults
      to the release this action comes from, so the action and the binary
      always match: ionut-t/bark/.github/actions/...@v2.35.0 installs
      v2.35.0. The binary is checked against the release's checksums and,
      for releases that have it, its signed build provenance.
    required: false
    default: ""
  provider:
    description: "LLM provider to use: gemini, openai or anthropic."
    required: true
  api-key:
    description: API key for the configured provider.
    required: true
  reviewer:
    description: |
      Reviewer to use. Accepts a built-in name (e.g. linus, bob, rob, yoda),
      a path to a .md file (e.g. .bark/reviewer.md), or omit to auto-detect
      .bark/reviewer.md in the repo root. A "bark: as <name>" label on the
      pull request overrides it (see reviewer-from-label).
    required: false
    default: ""
  reviewer-from-label:
    description: |
      Let a "bark: as <name>" label on the pull request (for example
      "bark: as Yoda") pick the reviewer for every review of it, over the
      reviewer input. The name must be a built-in or saved reviewer's name,
      not a file path. More than one such label fails the job. Only people
      with triage access can add labels. Set to false to ignore the label.
    required: false
    default: "true"
  instructions:
    description: |
      Instructions to guide the review. Accepts a built-in name (e.g. go, rust),
      a path to a .md file (e.g. .bark/review.md), raw text, or omit to
      auto-detect .bark/review.md in the repo root.
    required: false
    default: ""
  model:
    description: LLM model to use (e.g. gemini-2.5-pro, gpt-5.4-mini).
    required: true
  max-diff-tokens:
    description: Maximum number of diff tokens to include in the prompt, estimated at 2.5 characters a token (0 disables the limit).
    required: false
    default: ""
  max-diff-lines:
    description: Maximum number of diff lines to include in the prompt (0 disables the limit).
    deprecationMessage: max-diff-lines is deprecated; use max-diff-tokens.
    required: false
    default: ""
  timeout:
    description: |
      How long one model call may take before Bark gives up, as a duration
      such as 10m or 90s. Raise it for slow models or large pull requests
      (default: 5m, for the review and again for the check of its findings).
    required: false
    default: ""
  with-description:
    description: Include the PR description in the review context.
    required: false
    default: "false"
  with-context:
    description: Include enclosing declarations (functions, structs, classes) and related code (definitions the change uses, callers of changed functions) as context for review. On by default; set to false to leave it out, since it adds input tokens to each review.
    required: false
    default: "true"
  inline-comments:
    description: |
      Post the review as a pull request review, with findings as inline
      comments on the changed lines and fixes as suggestion blocks. Turns on
      structured findings. Findings are first checked with a second model
      call that reads the code around them; those that don't hold up are listed in
      a collapsed block instead of inline. When false, the review is posted
      as one comment.

      A pull request Bark reviewed before with inline comments is reviewed
      only from the commit the last review was made at. It falls back to the
      whole pull request when there's no earlier review, when that commit is
      no longer in the branch (rebase or force-push), when the branch merged
      other commits since, or when its base changed (retargeted). When
      nothing changed, nothing is posted.
    required: false
    default: "false"
  full-review:
    description: Review the whole pull request, not only the changes since Bark's last review of it. Only matters with inline-comments.
    required: false
    default: "false"
  resolve-fixed:
    description: |
      With inline-comments, resolve the threads of Bark's earlier inline
      comments that its check finds fixed in code changed since, and reply
      on each with the reason. Resolving needs the job's token to have
      contents: write as well as pull-requests: write; without it the
      threads stay open, with a warning. Set to false to leave them open.
    required: false
    default: "true"
  fail-on:
    description: |
      Fail the job when the review keeps a finding of this severity or
      higher: critical, high, medium or low. Leave empty to never fail.
      Turns on structured findings. Findings Bark's check doubts don't
      count; repeats of points raised in an earlier review of the pull
      request do, since they're still in the code. The review is posted
      first, so it's on the pull request when the job fails.

      With inline-comments, only the commits since Bark's last review are
      reviewed, so a push that doesn't touch an unfixed issue's code can
      pass. Set full-review to review the whole pull request every time.
    required: false
    default: ""
  approve:
    description: |
      Approve the pull request when the review keeps no finding at or above
      approve-below, saw the whole change, and gave a verdict. Needs
      inline-comments. Otherwise the review is posted as a comment.

      With only the changes since Bark's last review reviewed, it also
      needs every point raised earlier to be dismissed, doubted by Bark's
      check, or resolved (Bark resolves the ones its check finds fixed;
      see resolve-fixed). Set full-review to check them again on every
      push.

      A pull request that changes a file in .bark, .barkignore or (with
      house rules on) a house-rules file isn't approved: Bark reads them
      from the pull request's own checkout, so it could set its own bar.

      A later review that doesn't approve dismisses Bark's earlier
      approvals. Pushes don't run Bark, so to drop an approval on every
      push, turn on "Dismiss stale pull request approvals when new commits
      are pushed" in the branch's ruleset.

      GitHub only lets GitHub Actions approve when the repository (or
      organization) allows it: Settings → Actions → General → "Allow
      GitHub Actions to create and approve pull requests". When it
      doesn't, the review is posted as a comment with a warning.
    required: false
    default: "false"
  approve-below:
    description: |
      With approve, approve only when every finding is below this
      severity: critical, high, medium or low. Defaults to medium, so low
      findings are left as comments on the approval; low approves only a
      review with no findings. A lower fail-on wins, since a review that
      fails doesn't approve.
    required: false
    default: ""
  github-token:
    description: GitHub token for posting PR comments
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # The whole history: a review of only the changes since the last
        # one diffs the commits locally.
        fetch-depth: 0

    - name: Install bark
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BARK_VERSION: ${{ inputs.bark-version }}
      run: bash "$GITHUB_ACTION_PATH/../install-bark.sh"

    - name: Run bark review
      id: review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        # Values reach the script through env: an expression in the script
        # would be pasted in before bash parses it.
        BARK_PROVIDER: ${{ inputs.provider }}
        BARK_API_KEY: ${{ inputs.api-key }}
        BARK_REVIEWER: ${{ inputs.reviewer }}
        BARK_REVIEWER_FROM_LABEL: ${{ inputs.reviewer-from-label }}
        REPO: ${{ github.repository }}
        BARK_INSTRUCTIONS: ${{ inputs.instructions }}
        BARK_MODEL: ${{ inputs.model }}
        BARK_MAX_DIFF_TOKENS: ${{ inputs.max-diff-tokens }}
        BARK_MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
        BARK_WITH_CONTEXT: ${{ inputs.with-context }}
        BARK_WITH_DESCRIPTION: ${{ inputs.with-description }}
        BARK_INLINE_COMMENTS: ${{ inputs.inline-comments }}
        BARK_FULL_REVIEW: ${{ inputs.full-review }}
        BARK_RESOLVE_FIXED: ${{ inputs.resolve-fixed }}
        BARK_FAIL_ON: ${{ inputs.fail-on }}
        BARK_TIMEOUT: ${{ inputs.timeout }}
        BARK_APPROVE: ${{ inputs.approve }}
        BARK_APPROVE_BELOW: ${{ inputs.approve-below }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        PROVIDER=$(echo "$BARK_PROVIDER" | tr '[:upper:]' '[:lower:]')
        case "$PROVIDER" in
          "gemini")
            export GEMINI_API_KEY="$BARK_API_KEY"
            ;;
          "openai")
            export OPENAI_API_KEY="$BARK_API_KEY"
            ;;
          "anthropic")
            export ANTHROPIC_API_KEY="$BARK_API_KEY"
            ;;
          "vertexai"|"ollama")
            echo "Error: provider '$PROVIDER' needs more than an API key (Vertex AI: service-account credentials; Ollama: a reachable server) and is not supported by this action. Use gemini, openai or anthropic." >&2
            exit 1
            ;;
          *)
            echo "Error: unknown provider '$PROVIDER'. Use gemini, openai or anthropic." >&2
            exit 1
            ;;
        esac
        unset BARK_API_KEY

        ARGS=(review --pr "$PR_NUMBER" --provider "$PROVIDER")

        if [ "$BARK_REVIEWER_FROM_LABEL" != "false" ]; then
          LABEL_REVIEWER=$(bash "$GITHUB_ACTION_PATH/../reviewer-from-label.sh")
          if [ -n "$LABEL_REVIEWER" ]; then
            echo "Reviewer from the pull request's \"bark: as\" label: $LABEL_REVIEWER"
            BARK_REVIEWER=$LABEL_REVIEWER
          fi
        fi
        if [ -n "$BARK_REVIEWER" ]; then
          ARGS+=(--as "$BARK_REVIEWER")
        fi

        if [ -n "$BARK_INSTRUCTIONS" ]; then
          ARGS+=(--instructions "$BARK_INSTRUCTIONS")
        fi

        ARGS+=(--model "$BARK_MODEL")
        [ -n "$BARK_MAX_DIFF_TOKENS" ] && ARGS+=(--max-diff-tokens "$BARK_MAX_DIFF_TOKENS")
        [ -n "$BARK_MAX_DIFF_LINES" ] && ARGS+=(--max-diff-lines "$BARK_MAX_DIFF_LINES")
        # Either way: context is on by default, so "false" must reach Bark.
        [ -n "$BARK_WITH_CONTEXT" ] && ARGS+=("--with-context=$BARK_WITH_CONTEXT")
        [ "$BARK_WITH_DESCRIPTION" = "true" ] && ARGS+=(--with-description)
        [ "$BARK_INLINE_COMMENTS" = "true" ] && ARGS+=(--comment)
        # Only when set, so a pinned older Bark doesn't get a flag it lacks.
        [ "$BARK_FULL_REVIEW" = "true" ] && ARGS+=(--full)
        [ "$BARK_INLINE_COMMENTS" = "true" ] && [ "$BARK_RESOLVE_FIXED" = "false" ] && ARGS+=(--no-resolve)
        [ -n "$BARK_FAIL_ON" ] && ARGS+=(--fail-on "$BARK_FAIL_ON")
        [ -n "$BARK_TIMEOUT" ] && ARGS+=(--timeout "$BARK_TIMEOUT")
        if [ "$BARK_APPROVE" = "true" ]; then
          if [ "$BARK_INLINE_COMMENTS" != "true" ]; then
            echo "Error: approve needs inline-comments: true." >&2
            exit 1
          fi
          ARGS+=(--approve)
          [ -n "$BARK_APPROVE_BELOW" ] && ARGS+=(--approve-below "$BARK_APPROVE_BELOW")
        fi

        # Exit status 3 means the review kept findings at or above fail-on.
        # The review is still posted and labelled; the last step fails the
        # job. Any other failure stops here. Bark's messages are copied to a
        # file as they print, to read the reviewer it picked from
        # preferred_reviewers, if any.
        STATUS=0
        # The review goes to the file and Bark's messages through tee; under
        # pipefail the status is Bark's.
        bark "${ARGS[@]}" 2>&1 > /tmp/bark-review.txt | tee /tmp/bark-stderr.txt >&2 || STATUS=$?
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

        # For the "Reviewed by" label.
        if [ -z "$BARK_REVIEWER" ]; then
          PICKED_PREFIX='bark: reviewer picked from preferred_reviewers: '
          PICKED=$(grep -m1 "^$PICKED_PREFIX" /tmp/bark-stderr.txt || true)
          BARK_REVIEWER=${PICKED#"$PICKED_PREFIX"}
        fi
        echo "reviewer=$BARK_REVIEWER" >> "$GITHUB_OUTPUT"

        if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 3 ]; then
          exit "$STATUS"
        fi

        # Bark prints a line even when nothing changed since its last
        # review, so empty output means something went wrong.
        if [ ! -s /tmp/bark-review.txt ]; then
          echo "Review output is empty. See Bark's output above." >&2
          exit 1
        fi

    - name: Post or update PR comment
      if: inputs.inline-comments != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        MARKER="<!-- bark-review -->"
        BODY=$(printf '%s\n## Bark AI Code Review\n\n%s' "$MARKER" "$(cat /tmp/bark-review.txt)")

        # --paginate: without it gh returns only the first 30 comments, and on a
        # busy PR the earlier review is missed and a duplicate posted. The first
        # ID is taken in bash: | head -1 can kill gh with SIGPIPE under pipefail.
        COMMENT_IDS=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq '.[] | select(.body | startswith("<!-- bark-review -->")) | .id')
        COMMENT_ID=${COMMENT_IDS%%$'\n'*}

        if [ -n "$COMMENT_ID" ]; then
          jq -n --arg body "$BODY" '{"body": $body}' | \
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH --input -
        else
          jq -n --arg body "$BODY" '{"body": $body}' | \
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -X POST --input -
        fi

    - name: Add reviewer label
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REVIEWER: ${{ steps.review.outputs.reviewer }}
      run: |
        LABEL="Reviewed by $(bash "$GITHUB_ACTION_PATH/../reviewer-label-name.sh" "$REVIEWER")"
        gh label create "$LABEL" --repo "$REPO" --color "0075ca" --force 2>/dev/null || true
        gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$LABEL"

    - name: Fail on findings
      if: steps.review.outputs.status == '3'
      shell: bash
      env:
        BARK_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "Bark kept findings at or above $BARK_FAIL_ON severity; the run bark review step lists them." >&2
        exit 1
