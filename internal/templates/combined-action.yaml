name: Bark

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  pr-description:
    name: Generate PR Description
    runs-on: ubuntu-latest
    if: "github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'bark: describe')"
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: ionut-t/bark/.github/actions/bark-pr-description@main
        with:
          bark-version: latest
          provider: ${{ vars.BARK_PROVIDER }}
          api-key: ${{ secrets.BARK_API_KEY }}
          model: ${{ vars.BARK_MODEL }}
          max-diff-tokens: ${{ vars.BARK_MAX_DIFF_TOKENS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  review:
    name: AI Code Review
    needs: pr-description
    if: "always() && (needs.pr-description.result == 'skipped' || (needs.pr-description.result == 'success' && github.event.action == 'opened'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: ionut-t/bark/.github/actions/bark-review@main
        with:
          bark-version: latest
          provider: ${{ vars.BARK_PROVIDER }}
          api-key: ${{ secrets.BARK_API_KEY }}
          model: ${{ vars.BARK_MODEL }}
          reviewer: ${{ vars.BARK_REVIEWER }}
          max-diff-tokens: ${{ vars.BARK_MAX_DIFF_TOKENS }}
          with-context: ${{ vars.BARK_WITH_CONTEXT }}
          # Posts a pull request review with inline comments. A pull request
          # Bark reviewed before is then reviewed only from the commit the
          # last review was made at. Set BARK_INLINE_COMMENTS to false to post
          # one comment with the whole review instead.
          inline-comments: ${{ vars.BARK_INLINE_COMMENTS || 'true' }}
          # Review the whole pull request on every run, not only the new commits.
          # full-review: true
          # Fail the job when the review keeps a finding of this severity or
          # higher (critical, high, medium or low), after posting it. With
          # inline comments, only new commits are reviewed: add full-review
          # to fail on every unfixed issue each run.
          # fail-on: high
          with-description: ${{ needs.pr-description.result == 'success' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
