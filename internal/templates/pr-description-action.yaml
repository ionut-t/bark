name: Bark PR Description

on:
  pull_request:
    types: [opened, labeled]

jobs:
  pr-description:
    name: Generate PR Description
    runs-on: ubuntu-latest
    if: "github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name == 'bark: describe')"
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Pinned to the Bark release that wrote this workflow; the action
      # installs that same release. Use @v2 to follow every v2 release, or
      # let Dependabot (github-actions) bump the exact version.
      - uses: ionut-t/bark/.github/actions/bark-pr-description@{{ACTION_REF}}
        with:
          provider: ${{ vars.BARK_PROVIDER }}
          api-key: ${{ secrets.BARK_API_KEY }}
          model: ${{ vars.BARK_MODEL }}
          max-diff-tokens: ${{ vars.BARK_MAX_DIFF_TOKENS }}
          timeout: ${{ vars.BARK_TIMEOUT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
